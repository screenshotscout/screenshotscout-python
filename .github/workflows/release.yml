# Publishes the screenshotscout package to PyPI when a vX.Y.Z tag is pushed, then
# creates the GitHub release from the tag message's body.
#
# Running it by hand (Actions > Release > Run workflow) is a dry run: it checks,
# tests and builds, and never publishes. Give it the new version to also check
# pyproject.toml. Tick "check credentials" to confirm that PyPI trusts this
# workflow (it mints a short-lived token and uploads nothing).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run only: fail unless pyproject.toml says this version (for example 1.2.3)"
        required: false
        type: string
      check_credentials:
        description: "Also check PyPI trusted publishing for the release environment (publishes nothing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The oldest supported Python (requires-python), the build version, and the newest.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" twine
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy

      - name: Check that pyproject.toml has the release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then expected="${GITHUB_REF_NAME#v}"; else expected="$INPUT_VERSION"; fi
          actual="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "pyproject.toml version: $actual"
          if [[ -n "$expected" && "$actual" != "$expected" ]]; then
            echo "::error::pyproject.toml says $actual, but the release is $expected."
            exit 1
          fi

      - name: Build the wheel and sdist
        run: |
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Read the release notes from the tag
        if: github.event_name == 'push'
        run: |
          # Fetch the tag object itself, so an annotated tag stays annotated.
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::${GITHUB_REF_NAME} isn't an annotated tag, so it has no release notes. Create it with git tag -a."
            exit 1
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Tag ${GITHUB_REF_NAME} has no release notes. Write them in the tag message, below the subject line."
            exit 1
          fi
          cat release-notes.md

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # Manual runs only: proves PyPI trusts this workflow by minting a token, which is never used.
  credentials:
    if: github.event_name == 'workflow_dispatch' && inputs.check_credentials
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Ask PyPI for a trusted-publishing token
        run: |
          audience="$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)"
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r .value)"
          response="$(curl -sS -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\":\"${oidc}\"}")"
          if jq -e '.success == true' <<<"$response" >/dev/null; then
            echo "PyPI accepted the trusted publisher."
          else
            echo "::error::PyPI refused: $(jq -c '.errors // .message // "no details"' <<<"$response")"
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

      - name: Wait until PyPI serves the new version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/screenshotscout/$version/json"; then
              echo "screenshotscout $version is live on PyPI."
              exit 0
            fi
            sleep 10
          done
          echo "::error::screenshotscout $version isn't visible on PyPI after 10 minutes."
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub release for $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=()
          if [[ "$version" =~ [a-z] ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Screenshot Scout Python SDK $version" --notes-file release-notes.md "${flags[@]}"
